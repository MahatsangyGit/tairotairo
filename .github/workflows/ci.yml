name: CI

on:
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tairo
          POSTGRES_PASSWORD: tairo
          POSTGRES_DB: tairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tairo -d tairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tairo:tairo@localhost:5432/tairo_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-at-least-16-chars
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply Supabase SQL migrations
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            case "$f" in
              *010_rls_enforcement*) echo "Skip obsolete $f"; continue ;;
              *016_decimal_amounts*) echo "Skip commented $f"; continue ;;
            esac
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: npx prisma validate
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:server

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tairo
          POSTGRES_PASSWORD: tairo
          POSTGRES_DB: tairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tairo -d tairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://tairo:tairo@localhost:5432/tairo_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-16chars
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: production
      TAIRO_CUSTOM_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            case "$f" in
              *010_rls_enforcement*) continue ;;
              *016_decimal_amounts*) continue ;;
            esac
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
      - run: npm run test:e2e
