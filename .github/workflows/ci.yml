name: CI

on:
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tairo
          POSTGRES_PASSWORD: tairo
          POSTGRES_DB: tairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tairo -d tairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tairo:tairo@localhost:5432/tairo_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-at-least-16-chars
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Synchronize Prisma schema and apply current migrations
        run: npm run db:migrate:neon
      - run: npx prisma validate
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:server

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tairo
          POSTGRES_PASSWORD: tairo
          POSTGRES_DB: tairo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tairo -d tairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://tairo:tairo@localhost:5432/tairo_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-cron-secret-16chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NODE_ENV: production
      TAIRO_CUSTOM_SERVER: "1"
      IMAGE_OPTIMIZE_MODE: inline
      SUBSCRIPTION_PAYMENT_SIMULATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies including build tooling
        run: npm ci --include=dev
      - run: npx prisma generate
      - name: Synchronize Prisma schema and apply current migrations
        run: npm run db:migrate:neon
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start > /tmp/tairo-server.log 2>&1 &
          server_pid=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/tairo-server.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/tairo-server.log
          exit 1
      - run: npm run test:e2e
