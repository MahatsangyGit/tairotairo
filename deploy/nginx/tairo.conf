# NGINX reverse proxy pour Tairo (VPS production).
#
# Topologie attendue :
#   Client → (CDN plus tard) → NGINX → 2 process Node (`dist/server.js`)
#   - app #1 : 127.0.0.1:3001
#   - app #2 : 127.0.0.1:3002
#   Worker Sharp/FFmpeg : process séparés (pas dans cet upstream).
#
# Notes projet :
# - CDN en prod : ce fichier n'ajoute PAS de cache local pour `/_next/static`.
# - Uploads vidéo : routes admin only (`/api/admin/learning/lessons/*/video`) ~310 Mo.
# - Messagerie WS : `/ws/messaging` en WebSocket long-lived + sticky (ip_hash).
# - Rate limit app : `TRUSTED_PROXY_COUNT=1` (NGINX comme seul proxy de confiance).
#
# À adapter : domaines, chemins certificats, éventuellement `server_name` finaux.

# ── Upstream app Node (multi-instance) ────────────────────────────────────────
# Sticky sessions (important pour /ws/messaging).
upstream tairo_app {
    ip_hash;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name
        tairo-ampio.mg www.tairo-ampio.mg
        ampindramo.tairo-ampio.mg
        ampianaro.tairo-ampio.mg;

    # Let’s Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name
        tairo-ampio.mg www.tairo-ampio.mg
        ampindramo.tairo-ampio.mg
        ampianaro.tairo-ampio.mg;

    # TLS (Let’s Encrypt) — adapter le domaine si nécessaire
    ssl_certificate     /etc/letsencrypt/live/tairo-ampio.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tairo-ampio.mg/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    # Uploads : vidéos ampianaro (admin) jusqu’à ~310 Mo côté app.
    client_max_body_size 320m;
    client_body_timeout 300s;

    # Ne pas bufferiser de gros uploads en RAM plus que nécessaire.
    # (Les gros fichiers passent en fichier temporaire si besoin.)
    client_body_buffer_size 256k;

    # Headers proxy standard (cohérents avec rate-limit / logs app).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Timeouts par défaut (web app).
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # ── WebSocket messagerie ─────────────────────────────────────────────────
    location /ws/messaging {
        proxy_pass http://tairo_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WS long-lived
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # Sticky assuré par `ip_hash` dans l'upstream.
    }

    # ── Uploads gros fichiers (admin vidéo) ──────────────────────────────────
    # Route app : /api/admin/learning/lessons/:id/video
    location ~ ^/api/admin/learning/lessons/[^/]+/video/?$ {
        proxy_pass http://tairo_app;
        proxy_http_version 1.1;

        # Laisser passer l'upload sans lire tout en mémoire.
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── Reste de l’application ───────────────────────────────────────────────
    location / {
        proxy_pass http://tairo_app;
        proxy_http_version 1.1;
    }
}
